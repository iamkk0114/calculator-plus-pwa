<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 銀色金屬機身底板 -->
  <rect width="512" height="512" rx="96" fill="#d8d8d8" stroke="#444" stroke-width="8"/>
  <!-- 藍綠液晶螢幕 -->
  <rect x="44" y="44" width="424" height="140" rx="16" fill="#8ab8ca" stroke="#2b3a41" stroke-width="8"/>
  <text x="442" y="138" font-family="Arial, sans-serif" font-size="88" fill="#122026" text-anchor="end">0</text>
  <!-- 第一排深灰藍記憶鍵 -->
  <rect x="44" y="206" width="96" height="52" rx="10" fill="#6d7481" stroke="#2a2a2a" stroke-width="4"/>
  <text x="92" y="242" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">mc</text>
  <rect x="153" y="206" width="96" height="52" rx="10" fill="#6d7481" stroke="#2a2a2a" stroke-width="4"/>
  <text x="201" y="242" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">m+</text>
  <rect x="262" y="206" width="96" height="52" rx="10" fill="#6d7481" stroke="#2a2a2a" stroke-width="4"/>
  <text x="310" y="242" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">m-</text>
  <rect x="372" y="206" width="96" height="52" rx="10" fill="#6d7481" stroke="#2a2a2a" stroke-width="4"/>
  <text x="420" y="242" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" text-anchor="middle">mr</text>
  <!-- 珊瑚紅 AC 鍵與銀灰按鍵 -->
  <rect x="44" y="276" width="124" height="88" rx="12" fill="#e78880" stroke="#2a2a2a" stroke-width="4"/>
  <text x="106" y="336" font-family="Arial, sans-serif" font-size="48" fill="#1b1b1b" text-anchor="middle">AC</text>
  <rect x="194" y="276" width="124" height="88" rx="12" fill="#aeb3bf" stroke="#2a2a2a" stroke-width="4"/>
  <text x="256" y="336" font-family="Arial, sans-serif" font-size="48" fill="#1b1b1b" text-anchor="middle">%</text>
  <rect x="344" y="276" width="124" height="88" rx="12" fill="#aeb3bf" stroke="#2a2a2a" stroke-width="4"/>
  <text x="406" y="336" font-family="Arial, sans-serif" font-size="54" fill="#1b1b1b" text-anchor="middle">÷</text>
  <!-- 底部數字鍵與橘色等於鍵 -->
  <rect x="44" y="382" width="124" height="88" rx="12" fill="#b7b5ac" stroke="#2a2a2a" stroke-width="4"/>
  <text x="106" y="444" font-family="Arial, sans-serif" font-size="54" fill="#151515" text-anchor="middle">7</text>
  <rect x="194" y="382" width="124" height="88" rx="12" fill="#b7b5ac" stroke="#2a2a2a" stroke-width="4"/>
  <text x="256" y="444" font-family="Arial, sans-serif" font-size="54" fill="#151515" text-anchor="middle">8</text>
  <rect x="344" y="382" width="124" height="88" rx="12" fill="#ec913d" stroke="#2a2a2a" stroke-width="4"/>
  <text x="406" y="444" font-family="Arial, sans-serif" font-size="58" fill="#181818" text-anchor="middle">=</text>
</svg>
